resources:
  jobs:
    logistica_carichi:
      ###############################################################################
      # Logistico 2.0 — Workflow: logistica_carichi
      # Versione: 3.0.0 — 2026-06-08
      # Schedule: ogni giorno 02:00 Europe/Rome
      # Dipende da: logistica_landing_ingestion (00:30), logistica_dim_refresh (01:00)
      ###############################################################################

      name: logistica_carichi
      description: |
        Pipeline area carichi: Bronze Logistix (4 transazionali multi-sito) -> Silver -> Gold F_CARICO
        + late arriving handler + F_TRACCIABILITA_LOTTI (CE178). Pattern Bronze=DELTA_MERGE,
        Silver=MERGE su chiave naturale, Gold=replaceWhere su ANNO_MESE / DATA.

      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: "Europe/Rome"
        pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - luigi.scrimitore@aperion.it
        no_alert_for_skipped_runs: true

      max_concurrent_runs: 1

      tags:
        domain: logistica
        area: carichi
        project: logistico_20

      parameters:
        - name: env
          default: "dev"
        - name: run_date
          default: "{{job.start_time.iso_date}}"
        - name: landing_base_path
          default: ${var.landing_base_path}
        - name: file_format
          default: "auto"
        - name: siti
          default: "lgax,lgcx,lcax,lccx,lexx,locx,lonx,lscx,lslx"
        - name: retail_master_schema
          default: ${var.retail_master_schema}

      # --- Compute: SERVERLESS (ADR-0009) ------------------------------------------
      # Nessun `job_clusters`: i task senza compute dichiarato girano su SERVERLESS
      # (Photon e autoscaling automatici). Le *cluster policy* NON si applicano al
      # serverless, come init scripts e spark_conf a livello cluster: eventuali Spark
      # conf vanno impostate a livello di sessione nel notebook (ADR-0015).
      # Dipendenze: environment job-level (override del "Notebook Environment").
      environments:
        - environment_key: default
          spec:
            environment_version: "2"   # allineare alla versione serverless raccomandata al 1o deploy
            dependencies:
              - logistica_utils==1.0.4

      tasks:

        # -- Bronze (landing -> Delta) ------------------------

        - task_key: bronze_carichi_dettagli
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/bronze/carichi/bronze_carichi_dettagli
            base_parameters:
              env: "{{job.parameters.env}}"
              run_date: "{{job.parameters.run_date}}"
              landing_base_path: "{{job.parameters.landing_base_path}}"
              file_format: "{{job.parameters.file_format}}"
              siti: "{{job.parameters.siti}}"
          max_retries: 2
          timeout_seconds: 7200

        - task_key: bronze_carichi_testate
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/bronze/carichi/bronze_carichi_testate
            base_parameters:
              env: "{{job.parameters.env}}"
              run_date: "{{job.parameters.run_date}}"
              landing_base_path: "{{job.parameters.landing_base_path}}"
              file_format: "{{job.parameters.file_format}}"
              siti: "{{job.parameters.siti}}"
          max_retries: 2
          timeout_seconds: 7200

        - task_key: bronze_pesate
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/bronze/carichi/bronze_pesate
            base_parameters:
              env: "{{job.parameters.env}}"
              run_date: "{{job.parameters.run_date}}"
              landing_base_path: "{{job.parameters.landing_base_path}}"
              file_format: "{{job.parameters.file_format}}"
              siti: "{{job.parameters.siti}}"
          max_retries: 2
          timeout_seconds: 7200

        - task_key: bronze_traccia_ce178
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/bronze/carichi/bronze_traccia_ce178
            base_parameters:
              env: "{{job.parameters.env}}"
              run_date: "{{job.parameters.run_date}}"
              landing_base_path: "{{job.parameters.landing_base_path}}"
              file_format: "{{job.parameters.file_format}}"
              siti: "{{job.parameters.siti}}"
          max_retries: 2
          timeout_seconds: 7200


        # -- Silver (cleansing + curated) ------------------------

        - task_key: silver_carichi_dettagli
          depends_on:
            - task_key: bronze_carichi_dettagli
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/silver/carichi/silver_carichi_dettagli
            base_parameters:
              env: "{{job.parameters.env}}"
              run_date: "{{job.parameters.run_date}}"
          max_retries: 2
          timeout_seconds: 7200

        - task_key: silver_carichi_testate
          depends_on:
            - task_key: bronze_carichi_testate
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/silver/carichi/silver_carichi_testate
            base_parameters:
              env: "{{job.parameters.env}}"
              run_date: "{{job.parameters.run_date}}"
          max_retries: 2
          timeout_seconds: 7200

        - task_key: silver_pesate
          depends_on:
            - task_key: bronze_pesate
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/silver/carichi/silver_pesate
            base_parameters:
              env: "{{job.parameters.env}}"
              run_date: "{{job.parameters.run_date}}"
          max_retries: 2
          timeout_seconds: 7200

        - task_key: silver_prep_carico
          depends_on:
            - task_key: silver_carichi_dettagli
            - task_key: silver_carichi_testate
            - task_key: silver_pesate
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/silver/carichi/silver_prep_carico
            base_parameters:
              env: "{{job.parameters.env}}"
              run_date: "{{job.parameters.run_date}}"
          max_retries: 2
          timeout_seconds: 7200

        - task_key: silver_traccia_ce178
          depends_on:
            - task_key: bronze_traccia_ce178
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/silver/carichi/silver_traccia_ce178
            base_parameters:
              env: "{{job.parameters.env}}"
              run_date: "{{job.parameters.run_date}}"
          max_retries: 2
          timeout_seconds: 7200

        - task_key: silver_tracciabilita_lotto
          depends_on:
            - task_key: bronze_traccia_ce178
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/silver/tracciabilita/silver_tracciabilita_lotto
            base_parameters:
              env: "{{job.parameters.env}}"
              run_date: "{{job.parameters.run_date}}"
          max_retries: 2
          timeout_seconds: 7200


        # -- Gold (dim/fact/aggregati) ------------------------

        - task_key: gold_f_carico
          depends_on:
            - task_key: silver_prep_carico
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/gold/carichi/gold_f_carico
            base_parameters:
              env: "{{job.parameters.env}}"
              run_date: "{{job.parameters.run_date}}"
              retail_master_schema: "{{job.parameters.retail_master_schema}}"
          max_retries: 2
          timeout_seconds: 7200

        - task_key: gold_late_arriving_handler
          depends_on:
            - task_key: silver_prep_carico
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/gold/carichi/gold_late_arriving_handler
            base_parameters:
              env: "{{job.parameters.env}}"
              run_date: "{{job.parameters.run_date}}"
              retail_master_schema: "{{job.parameters.retail_master_schema}}"
          max_retries: 2
          timeout_seconds: 7200

        - task_key: gold_f_tracciabilita_lotti
          depends_on:
            - task_key: silver_tracciabilita_lotto
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/gold/tracciabilita/gold_f_tracciabilita_lotti
            base_parameters:
              env: "{{job.parameters.env}}"
              run_date: "{{job.parameters.run_date}}"
          max_retries: 2
          timeout_seconds: 7200


        # -- DQ gate (ACT_9010) ----------------------------------

        - task_key: dq_gate
          description: "DQ gate: acceptance criteria + persistenza esiti + blocco su BLOCKING"
          depends_on:
            - task_key: gold_f_carico
            - task_key: gold_late_arriving_handler
            - task_key: gold_f_tracciabilita_lotti
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/dq/dq_gate
            base_parameters:
              env: "{{job.parameters.env}}"
              run_date: "{{job.parameters.run_date}}"
              pipelines: "gold_f_carico,gold_f_tracciabilita_lotti"
              gate: "true"
          max_retries: 0
          timeout_seconds: 1800
