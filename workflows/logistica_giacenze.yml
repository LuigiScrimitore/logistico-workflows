###############################################################################
# Logistico 2.0 — Workflow: logistica_giacenze
# Versione: 3.0.0 — 2026-06-08
# Schedule: ogni giorno 03:30 Europe/Rome
# Dipende da: logistica_landing_ingestion (T_STOCK gia' caricato in Bronze SNAPSHOT)
###############################################################################

name: logistica_giacenze
description: |
  Pipeline giacenze: Silver giacenza_daily (filtro _bronze_load_date = run_date) +
  Silver giacenza_aggregata (cross-magazzino) + Gold F_GIACENZE_DAILY (replaceWhere DATA_FOTO).
  Pattern Bronze=SNAPSHOT (gia' caricato dal landing_ingestion).
  L'aggregato mensile A_GIACENZE_MONTHLY e' nel workflow logistica_datamart (06:00).

schedule:
  quartz_cron_expression: "0 30 3 * * ?"
  timezone_id: "Europe/Rome"
  pause_status: UNPAUSED

email_notifications:
  on_failure:
    - luigi.scrimitore@aperion.it
  no_alert_for_skipped_runs: true

max_concurrent_runs: 1

tags:
  domain: logistica
  area: giacenze
  project: logistico_20

parameters:
  - name: env
    default: "dev"
  - name: run_date
    default: "{{job.start_time.iso_date}}"

# --- Compute: SERVERLESS (ADR-0009) ------------------------------------------
# Nessun `job_clusters`: i task senza compute dichiarato girano su SERVERLESS
# (Photon e autoscaling automatici). Le *cluster policy* NON si applicano al
# serverless, come init scripts e spark_conf a livello cluster: eventuali Spark
# conf vanno impostate a livello di sessione nel notebook (ADR-0015).
# Dipendenze: environment job-level (override del "Notebook Environment").
environments:
  - environment_key: default
    spec:
      environment_version: "2"   # allineare alla versione serverless raccomandata al 1o deploy
      dependencies:
        - ../lib/dist/logistica_utils-*.whl

tasks:

  # -- Bronze (landing -> Delta) ------------------------

  - task_key: bronze_catena
    environment_key: default
    notebook_task:
      notebook_path: ../notebooks/bronze/giacenze/bronze_catena
      base_parameters:
        env: "{{job.parameters.env}}"
        run_date: "{{job.parameters.run_date}}"
        landing_base_path: "{{job.parameters.landing_base_path}}"
        file_format: "{{job.parameters.file_format}}"
        siti: "{{job.parameters.siti}}"
    max_retries: 2
    timeout_seconds: 7200

  - task_key: bronze_catena_esterni
    environment_key: default
    notebook_task:
      notebook_path: ../notebooks/bronze/giacenze/bronze_catena_esterni
      base_parameters:
        env: "{{job.parameters.env}}"
        run_date: "{{job.parameters.run_date}}"
        landing_base_path: "{{job.parameters.landing_base_path}}"
        file_format: "{{job.parameters.file_format}}"
        siti: "{{job.parameters.siti}}"
    max_retries: 2
    timeout_seconds: 7200

  - task_key: bronze_giacenze_snapshot
    environment_key: default
    notebook_task:
      notebook_path: ../notebooks/bronze/giacenze/bronze_giacenze_snapshot
      base_parameters:
        env: "{{job.parameters.env}}"
        run_date: "{{job.parameters.run_date}}"
        landing_base_path: "{{job.parameters.landing_base_path}}"
        file_format: "{{job.parameters.file_format}}"
    max_retries: 2
    timeout_seconds: 7200

  - task_key: bronze_movimenti_magazzino
    environment_key: default
    notebook_task:
      notebook_path: ../notebooks/bronze/giacenze/bronze_movimenti_magazzino
      base_parameters:
        env: "{{job.parameters.env}}"
        run_date: "{{job.parameters.run_date}}"
        landing_base_path: "{{job.parameters.landing_base_path}}"
        file_format: "{{job.parameters.file_format}}"
        siti: "{{job.parameters.siti}}"
    max_retries: 2
    timeout_seconds: 7200


  # -- Silver (cleansing + curated) ------------------------

  - task_key: silver_t_stock
    depends_on:
      - task_key: silver_catena_unificata
    environment_key: default
    notebook_task:
      notebook_path: ../notebooks/silver/cdt_estr/silver_t_stock
      base_parameters:
        env: "{{job.parameters.env}}"
        run_date: "{{job.parameters.run_date}}"
    max_retries: 2
    timeout_seconds: 7200

  - task_key: silver_catena_clean
    depends_on:
      - task_key: bronze_catena
    environment_key: default
    notebook_task:
      notebook_path: ../notebooks/silver/giacenze/silver_catena_clean
      base_parameters:
        env: "{{job.parameters.env}}"
        run_date: "{{job.parameters.run_date}}"
    max_retries: 2
    timeout_seconds: 7200

  - task_key: silver_catena_esterni_clean
    depends_on:
      - task_key: bronze_catena_esterni
    environment_key: default
    notebook_task:
      notebook_path: ../notebooks/silver/giacenze/silver_catena_esterni_clean
      base_parameters:
        env: "{{job.parameters.env}}"
        run_date: "{{job.parameters.run_date}}"
    max_retries: 2
    timeout_seconds: 7200

  - task_key: silver_catena_unificata
    depends_on:
      - task_key: silver_catena_clean
      - task_key: silver_catena_esterni_clean
    environment_key: default
    notebook_task:
      notebook_path: ../notebooks/silver/giacenze/silver_catena_unificata
      base_parameters:
        env: "{{job.parameters.env}}"
        run_date: "{{job.parameters.run_date}}"
    max_retries: 2
    timeout_seconds: 7200

  - task_key: silver_giacenze_aggregata
    depends_on:
      - task_key: silver_prep_giacenze
    environment_key: default
    notebook_task:
      notebook_path: ../notebooks/silver/giacenze/silver_giacenze_aggregata
      base_parameters:
        env: "{{job.parameters.env}}"
        run_date: "{{job.parameters.run_date}}"
    max_retries: 2
    timeout_seconds: 7200

  - task_key: silver_prep_giacenze
    depends_on:
      - task_key: bronze_giacenze_snapshot
      - task_key: silver_t_stock
    environment_key: default
    notebook_task:
      notebook_path: ../notebooks/silver/giacenze/silver_prep_giacenze
      base_parameters:
        env: "{{job.parameters.env}}"
        run_date: "{{job.parameters.run_date}}"
    max_retries: 2
    timeout_seconds: 7200


  # -- Gold (dim/fact/aggregati) ------------------------

  - task_key: gold_f_giacenze_daily
    depends_on:
      - task_key: silver_prep_giacenze
    environment_key: default
    notebook_task:
      notebook_path: ../notebooks/gold/giacenze/gold_f_giacenze_daily
      base_parameters:
        env: "{{job.parameters.env}}"
        run_date: "{{job.parameters.run_date}}"
    max_retries: 2
    timeout_seconds: 7200


  # -- DQ gate (ACT_9010) ----------------------------------

  - task_key: dq_gate
    description: "DQ gate: acceptance criteria + persistenza esiti + blocco su BLOCKING"
    depends_on:
      - task_key: gold_f_giacenze_daily
    environment_key: default
    notebook_task:
      notebook_path: ../notebooks/dq/dq_gate
      base_parameters:
        env: "{{job.parameters.env}}"
        run_date: "{{job.parameters.run_date}}"
        pipelines: "gold_f_giacenze_daily"
        gate: "true"
    max_retries: 0
    timeout_seconds: 1800
