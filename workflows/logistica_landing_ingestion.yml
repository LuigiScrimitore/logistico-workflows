resources:
  jobs:
    logistica_landing_ingestion:
      ###############################################################################
      # Logistico 2.0 — Workflow: logistica_landing_ingestion
      # Versione: 3.0.0 — 2026-06-08
      # Schedule: ogni giorno 00:30 Europe/Rome (deve completare PRIMA degli altri workflow)
      # Sorgenti: CND + STAT (3 prep-spedizioni STAT aggiunti OP-16)
      ###############################################################################

      name: logistica_landing_ingestion
      description: |
        Ingestion giornaliera da ADLS Gen2 landing zone (push CSV/Parquet) verso Delta Bronze.
        Convenzione path: <source>-landing/{tabella}/YYYY/MM/DD/ (OP-07).
        Modalita' Bronze per tabella: SNAPSHOT (t_stock), FULL_OVERWRITE (anagrafiche), DELTA_MERGE (movimenti).
        Tutti i task tolerant-to-missing-file (exit "NO_DATA").

      schedule:
        quartz_cron_expression: "0 30 0 * * ?"
        timezone_id: "Europe/Rome"
        pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - luigi.scrimitore@aperion.it
        no_alert_for_skipped_runs: true

      max_concurrent_runs: 1

      tags:
        domain: logistica
        layer: bronze
        source: landing_zone
        project: logistico_20

      parameters:
        - name: siti
          default: "lgax,lgcx,lcax,lccx,lexx,locx,lonx,lscx,lslx"
        - name: env
          default: "dev"
        - name: run_date
          default: "{{job.start_time.iso_date}}"
        - name: landing_base_path
          default: ${var.landing_base_path}
        - name: file_format
          default: "auto"

      # --- Compute: SERVERLESS (ADR-0009) ------------------------------------------
      # Nessun `job_clusters`: i task senza compute dichiarato girano su SERVERLESS
      # (Photon e autoscaling automatici). Le *cluster policy* NON si applicano al
      # serverless, come init scripts e spark_conf a livello cluster: eventuali Spark
      # conf vanno impostate a livello di sessione nel notebook (ADR-0015).
      # Dipendenze: environment job-level (override del "Notebook Environment").
      environments:
        - environment_key: default
          spec:
            environment_version: "2"   # allineare alla versione serverless raccomandata al 1o deploy
            # [TEMP LOCALE — smoke test] wheel via %pip nei notebook (DBR-05/ADR-0025)
            dependencies: []

      tasks:

        # -- Bronze (landing -> Delta) ------------------------

        - task_key: bronze_aree_merceologiche
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/bronze/anagrafiche/bronze_aree_merceologiche.py
            base_parameters:
              env: "{{job.parameters.env}}"
              run_date: "{{job.parameters.run_date}}"
              landing_base_path: "{{job.parameters.landing_base_path}}"
              file_format: "{{job.parameters.file_format}}"
              siti: "{{job.parameters.siti}}"
          max_retries: 2
          timeout_seconds: 7200

        - task_key: bronze_carrellisti
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/bronze/anagrafiche/bronze_carrellisti.py
            base_parameters:
              env: "{{job.parameters.env}}"
              run_date: "{{job.parameters.run_date}}"
              landing_base_path: "{{job.parameters.landing_base_path}}"
              file_format: "{{job.parameters.file_format}}"
              siti: "{{job.parameters.siti}}"
          max_retries: 2
          timeout_seconds: 7200

        - task_key: bronze_classe_posto_pallet
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/bronze/anagrafiche/bronze_classe_posto_pallet.py
            base_parameters:
              env: "{{job.parameters.env}}"
              run_date: "{{job.parameters.run_date}}"
              landing_base_path: "{{job.parameters.landing_base_path}}"
              file_format: "{{job.parameters.file_format}}"
              siti: "{{job.parameters.siti}}"
          max_retries: 2
          timeout_seconds: 7200

        - task_key: bronze_corsie
