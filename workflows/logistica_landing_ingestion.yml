            notebook_path: ../notebooks/bronze/anagrafiche/bronze_corsie.py
            base_parameters:
              env: "{{job.parameters.env}}"
              run_date: "{{job.parameters.run_date}}"
              landing_base_path: "{{job.parameters.landing_base_path}}"
              file_format: "{{job.parameters.file_format}}"
              siti: "{{job.parameters.siti}}"
          max_retries: 2
          timeout_seconds: 7200

        - task_key: bronze_preparatori
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/bronze/anagrafiche/bronze_preparatori.py
