# Databricks Asset Bundle — Logistico 2.0 (release kit KIT-06)
# Scheletro per il rilascio a FASI (una wave alla volta). I job serverless e i
# tag costo sono dichiarativi; host/URL e secret vanno riempiti al gate di accesso.
#
# Deploy per fase:
#   databricks bundle deploy -t dev --var="wave=A"     # rilascia una wave
#   databricks bundle run logistica_wave_a -t dev      # esegue il job della wave
#
# NB: NIENTE credenziali/secret qui (vanno in profili/variabili CI mascherate).
#     Il tuning cloud (memoria/cluster) NON si eredita dal locale — vedi 14_release_kit §G.

bundle:
  name: logistico2-0

variables:
  env:
    description: Ambiente logico (dev|prod)
    default: dev
  notifications_email:
    description: Email per alerting job (DQ gate / failure)
    default: luigi.scrimitore@aperion.it

# Tag costo applicati a TUTTE le risorse del bundle (KIT-05). La pipeline/wave
# specifica viene sovrascritta a livello job.
sync:
  include:
    - ../../notebooks/**
    - ../../lib/**

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<WORKSPACE_DEV_URL>   # <-- da riempire al gate Azure/Databricks
      root_path: /Workspace/Repos/logistico/_bundle/${bundle.name}/${workspace.current_user.userName}
    variables:
      env: dev
    presets:
      tags:
        business_unit: logistica
        project: logistico2.0
        env: dev
        managed_by: dab

  prod:
    mode: production
    workspace:
      host: https://<WORKSPACE_PROD_URL>  # <-- da riempire (D4 _prod)
      root_path: /Workspace/Repos/logistico/_bundle/${bundle.name}
    variables:
      env: prod
    presets:
      tags:
        business_unit: logistica
        project: logistico2.0
        env: prod
        managed_by: dab

include:
  - resources/*.job.yml
