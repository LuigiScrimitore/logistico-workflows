# Wave A — Carichi (release kit KIT-06). TEMPLATE di riferimento per le altre wave.
# DAG: dimensioni -> F_CARICO -> smoke-test acceptance -> A_INBOUND (aggregato disaccoppiato).
# Compute: SERVERLESS (confermato Reply/Ippazio 2026-07-03: niente node_type/VM).
# Ogni task esegue un notebook esistente del repo; lo smoke-test usa acceptance.run_smoke_test
# con gate BLOCKING (fallisce il job se un check bloccante non passa).

resources:
  jobs:
    logistica_wave_a:
      name: "[${var.env}] logistica - wave A (carichi)"
      tags:
        business_unit: logistica
        project: logistico2.0
        env: ${var.env}
        pipeline: wave_a_carichi
        wave: A
      # Serverless: nessun job_cluster; i task notebook girano su compute serverless.
      email_notifications:
        on_failure:
          - ${var.notifications_email}

      # Schedulazione: placeholder (da attivare a regime, es. giornaliera 06:00).
      # schedule:
      #   quartz_cron_expression: "0 0 6 * * ?"
      #   timezone_id: "Europe/Rome"
      #   pause_status: PAUSED

      parameters:
        - name: env
          default: ${var.env}
        - name: run_date
          default: ""   # vuoto = today; passato dai run per backfill/incrementale

      tasks:
        # --- 1) DIMENSIONI (prerequisito dei fact) ---
        - task_key: dim_sito
          notebook_task:
            notebook_path: ../../notebooks/silver/dimensioni/silver_dim_sito.py
            base_parameters: { env: "${var.env}", run_date: "{{job.parameters.run_date}}" }
        - task_key: gold_dim_sito
          depends_on: [{ task_key: dim_sito }]
          notebook_task:
            notebook_path: ../../notebooks/gold/dimensioni/gold_dim_sito.py
            base_parameters: { env: "${var.env}", run_date: "{{job.parameters.run_date}}" }
        # (le altre dim — operatore/corriere/topografia/fornitore/articolo/calendario —
        #  si aggiungono qui con lo stesso pattern; omesse nello scheletro per brevità)

        # --- 2) SILVER carichi -> F_CARICO ---
        - task_key: silver_carichi_testate
          depends_on: [{ task_key: gold_dim_sito }]
          notebook_task:
            notebook_path: ../../notebooks/silver/carichi/silver_carichi_testate.py
            base_parameters: { env: "${var.env}", run_date: "{{job.parameters.run_date}}" }
        - task_key: silver_carichi_dettagli
          depends_on: [{ task_key: silver_carichi_testate }]
          notebook_task:
            notebook_path: ../../notebooks/silver/carichi/silver_carichi_dettagli.py
            base_parameters: { env: "${var.env}", run_date: "{{job.parameters.run_date}}" }
        - task_key: silver_pesate
          depends_on: [{ task_key: silver_carichi_testate }]
          notebook_task:
            notebook_path: ../../notebooks/silver/carichi/silver_pesate.py
            base_parameters: { env: "${var.env}", run_date: "{{job.parameters.run_date}}" }
        - task_key: silver_prep_carico
          depends_on: [{ task_key: silver_carichi_dettagli }, { task_key: silver_pesate }]
          notebook_task:
            notebook_path: ../../notebooks/silver/carichi/silver_prep_carico.py
            base_parameters: { env: "${var.env}", run_date: "{{job.parameters.run_date}}" }
        - task_key: gold_f_carico
          depends_on: [{ task_key: silver_prep_carico }]
          notebook_task:
            notebook_path: ../../notebooks/gold/carichi/gold_f_carico.py
            base_parameters: { env: "${var.env}", run_date: "{{job.parameters.run_date}}" }

        # --- 3) SMOKE-TEST acceptance (gate BLOCKING) ---
        - task_key: smoke_test_f_carico
          depends_on: [{ task_key: gold_f_carico }]
          notebook_task:
            notebook_path: ../../notebooks/maintenance/run_acceptance.py   # <-- wrapper da creare (usa acceptance.run_smoke_test)
            base_parameters:
              env: "${var.env}"
              run_date: "{{job.parameters.run_date}}"
              pipeline: "gold_f_carico"

        # --- 4) LAD resolver (dopo refresh dim) ---
        - task_key: lad_resolver_f_carico
          depends_on: [{ task_key: smoke_test_f_carico }]
          notebook_task:
            notebook_path: ../../notebooks/gold/maintenance/gold_lad_resolver.py
            base_parameters: { env: "${var.env}", fact_table: "F_CARICO" }

# NOTE:
# - Aggregato A_INBOUND = job SEPARATO (wave A-agg, disaccoppiato) — non in questo job.
# - run_acceptance.py: thin wrapper notebook che chiama acceptance.run_smoke_test(
#     spark, ACCEPTANCE_REGISTRY[pipeline], env, run_date) -> gate. Da creare al gate Git.
# - Tuning serverless (concurrency, spill) osservato dai Spark UI e calibrato per wave.
