# logistico-workflows — validate/deploy del Databricks Asset Bundle.
# Auth via Managed Identity (team 2026-08-27), come infrastructure: niente token.
# Variabili CI (Protected; main è branch protetto): DATABRICKS_HOST (workspace DEV),
# ARM_CLIENT_ID/ARM_TENANT_ID/ARM_SUBSCRIPTION_ID (user-assigned MI del runner).
stages: [validate, deploy]

default:
  tags: [azure-runner]   # group runner del subgroup Logistico (vedi Runners del progetto)
  image: python:3.11
  variables:
    ARM_USE_MSI: "true"   # auth Azure/Databricks via MI del runner (come infrastructure)
  before_script:
    # Databricks CLI NUOVA (quella legacy `pip install databricks-cli` NON ha `bundle`).
    - curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
    - databricks --version

validate:
  stage: validate
  script:
    - databricks bundle validate
  # TODO: installare il wheel di logistico-lib dal Package Registry (DBR-05) e
  #       pinnare la versione in databricks.yml (libraries: - whl: ...).

deploy_dev:
  stage: deploy
  script:
    - databricks bundle deploy -t dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_prod:
  stage: deploy
  script:
    - databricks bundle deploy -t prod
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual   # gate PROD manuale (ADR-0017 / ACT_0.2.4)
