# ─────────────────────────────────────────────────────────────────────────────
# Logistico 2.0 — Databricks Asset Bundle (consolidato, ACT_9018 / ADR-0021)
# Modello di deploy: pipeline PER-AREA. I job sono in workflows/*.yml, ciascuno
# in formato DAB `resources: jobs: <key>:`, inclusi qui via `include`.
# Rilascio a fasi (ADR-0017): si abilita/deploya una pipeline per-area alla volta.
# ─────────────────────────────────────────────────────────────────────────────

bundle:
  name: logistico

include:
  - workflows/*.yml

# ─────────────────────────────────────────────────────────────────────────────
# Variabili globali (override per target). Default = decisioni D2/D3
# (11_devops_handoff_databricks.md): landing = UC Volume; anagrafiche in <bronze>.condiviso.
# ─────────────────────────────────────────────────────────────────────────────
variables:
  env:
    description: "Ambiente di esecuzione (dev|prod)"
    default: dev
  landing_base_path:
    description: "Root landing (D3). Default UC Volume; per ADLS external usare abfss://<container>@<account>.dfs.core.windows.net"
    default: "/Volumes/landing_dev/logistica/files"
  retail_master_schema:
    description: "Catalog.schema anagrafiche condivise LU_* (D2). Default schema proprio condiviso in Bronze."
    default: "bronze_dev.condiviso"
  email_alert:
    description: "Email destinatario per alert failure"
    default: luigi.scrimitore@aperion.it
  siti_logistix:
    description: >-
      Siti Logistix elaborati dai job (sottocartelle di logistix-landing/). Devono coincidere con i db-link attivi
      dell'estrattore (scripts/landing_simulator/config.yaml). Worklog 2026-10-16-02, ACT_9030.
    default: "lbvx,lcax,leax,lfax,lfmx,lfqx,lfvx,lgax,lgcx,lgnx,lgqx,lgrx,lgvx,lgzx,lonx,losx,lslx,lsmx,lsvx"
  schedule_pause_status:
    description: >-
      Stato degli schedule dei job (LL-037). Default PAUSED: i deploy delle sandbox personali restano in pausa.
      La CI deploy_dev passa --var="schedule_pause_status=UNPAUSED" (job della Managed Identity attivi).
      Prod = PAUSED fino al go-live (worklog 2026-10-15-01), poi UNPAUSED.
    default: PAUSED

# NB (ADR-0009): job su compute SERVERLESS — nessun job cluster classico. Il wheel
# `logistica_utils` è dichiarato in `environments` di ciascun workflow come dipendenza
# PINNATA dal GitLab Package Registry (`logistica_utils==1.0.4`, DBR-05) — non più build
# locale da lib/ (che nel multi-repo è un repo separato).

# ─────────────────────────────────────────────────────────────────────────────
# Host workspace: NON dichiarato qui. DAB non ammette interpolazione `${...}` sui campi
# di autenticazione (workspace.host) → si usa la env `DATABRICKS_HOST` (variabile CI),
# letta automaticamente. Per PROD si valorizza `DATABRICKS_HOST` nel contesto del deploy prod.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# Target di deploy. `presets.tags` = cost tag applicati a tutte le risorse (KIT-05).
# ─────────────────────────────────────────────────────────────────────────────
targets:

  dev:
    mode: development
    default: true
    permissions:
      # I job gestiti dal bundle (DAB) non ammettono grant a mano: il deploy li
      # sovrascriverebbe. I permessi si dichiarano qui e valgono per TUTTE le risorse
      # del bundle -> Group-Engineering-dev vede/gestisce i job [dev <mi>] logistica_*. (LL-032)
      - level: CAN_MANAGE
        group_name: Group-Engineering-dev
    workspace:
      # mode:development: ogni sandbox deploya nella HOME dell'utente (default DAB),
      # dove i permessi ci sono gia'. La cartella condivisa /Workspace/data-platform/etl/logistica
      # resta riservata a CI/Managed Identity (evita 403 sulle sandbox personali).
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: dev
      email_alert: luigi.scrimitore@aperion.it
      # Landing dev letta direttamente dal container logisticolanding (cutover 2026-10-14, worklog 2026-10-14-01):
      # READ_FILES via External Location logisticolanding_dev -> Group-Engineering-dev (contiene la MI dei job).
      landing_base_path: "abfss://logisticolanding@stdevdataplatformweudata.dfs.core.windows.net"
      retail_master_schema: "bronze_dev.condiviso"
    presets:
      tags:
        business_unit: logistica
        project: logistico
        env: dev
        managed_by: dab

  prod:
    mode: production
    workspace:
      root_path: /Workspace/data-platform/etl/logistica/${bundle.target}
    variables:
      env: prod
      email_alert: luigi.scrimitore@aperion.it
      landing_base_path: "/Volumes/landing_prod/logistica/files"
      schedule_pause_status: PAUSED   # fino al go-live: poi UNPAUSED (worklog 2026-10-15-01)
      retail_master_schema: "bronze_prod.condiviso"
    presets:
      tags:
        business_unit: logistica
        project: logistico
        env: prod
        managed_by: dab
