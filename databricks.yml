# ─────────────────────────────────────────────────────────────────────────────
# Logistico 2.0 — Databricks Asset Bundle (consolidato, ACT_9018 / ADR-0021)
# Modello di deploy: pipeline PER-AREA. I job sono in workflows/*.yml, ciascuno
# in formato DAB `resources: jobs: <key>:`, inclusi qui via `include`.
# Rilascio a fasi (ADR-0017): si abilita/deploya una pipeline per-area alla volta.
# ─────────────────────────────────────────────────────────────────────────────

bundle:
  name: logistico

include:
  - workflows/*.yml

# ─────────────────────────────────────────────────────────────────────────────
# Variabili globali (override per target). Default = decisioni D2/D3
# (11_devops_handoff_databricks.md): landing = UC Volume; anagrafiche in <bronze>.condiviso.
# ─────────────────────────────────────────────────────────────────────────────
variables:
  env:
    description: "Ambiente di esecuzione (dev|prod)"
    default: dev
  landing_base_path:
    description: "Root landing (D3). Default UC Volume; per ADLS external usare abfss://<container>@<account>.dfs.core.windows.net"
    default: "/Volumes/landing_dev/logistica/files"
  retail_master_schema:
    description: "Catalog.schema anagrafiche condivise LU_* (D2). Default schema proprio condiviso in Bronze."
    default: "bronze_dev.condiviso"
  email_alert:
    description: "Email destinatario per alert failure"
    default: luigi.scrimitore@aperion.it

# NB (ADR-0009): job su compute SERVERLESS — nessun job cluster classico. Il wheel
# `logistica_utils` è dichiarato in `environments` di ciascun workflow come dipendenza
# PINNATA dal GitLab Package Registry (`logistica_utils==1.0.4`, DBR-05) — non più build
# locale da lib/ (che nel multi-repo è un repo separato).

# ─────────────────────────────────────────────────────────────────────────────
# Host workspace: NON dichiarato qui. DAB non ammette interpolazione `${...}` sui campi
# di autenticazione (workspace.host) → si usa la env `DATABRICKS_HOST` (variabile CI),
# letta automaticamente. Per PROD si valorizza `DATABRICKS_HOST` nel contesto del deploy prod.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# Target di deploy. `presets.tags` = cost tag applicati a tutte le risorse (KIT-05).
# ─────────────────────────────────────────────────────────────────────────────
targets:

  dev:
    mode: development
    default: true
    workspace:
      # mode:development esige un root_path univoco per utente (isolamento deploy):
      # aggiunto ${workspace.current_user.userName}. In CI l'utente è la MI.
      root_path: /Workspace/data-platform/etl/logistica/${bundle.target}/${workspace.current_user.userName}
    variables:
      env: dev
      email_alert: luigi.scrimitore@aperion.it
      landing_base_path: "/Volumes/landing_dev/logistica/files"
      retail_master_schema: "bronze_dev.condiviso"
    presets:
      tags:
        business_unit: logistica
        project: logistico
        env: dev
        managed_by: dab

  prod:
    mode: production
    workspace:
      root_path: /Workspace/data-platform/etl/logistica/${bundle.target}
    variables:
      env: prod
      email_alert: luigi.scrimitore@aperion.it
      landing_base_path: "/Volumes/landing_prod/logistica/files"
      retail_master_schema: "bronze_prod.condiviso"
    presets:
      tags:
        business_unit: logistica
        project: logistico
        env: prod
        managed_by: dab
